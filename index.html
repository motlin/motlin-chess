<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Motlin Chess</title>
		<meta name="description" content="Customizable chess with configurable board sizes and extra pieces." />

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Motlin Chess" />
		<meta property="og:title" content="Motlin Chess" />
		<meta property="og:description" content="Customizable chess with configurable board sizes and extra pieces." />
		<meta property="og:url" content="https://motlin-chess.pages.dev/" />
		<meta property="og:image" content="https://motlin-chess.pages.dev/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Motlin Chess — customizable chess with extra pieces" />

		<!-- Twitter / X -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Motlin Chess" />
		<meta name="twitter:description" content="Customizable chess with configurable board sizes and extra pieces." />
		<meta name="twitter:image" content="https://motlin-chess.pages.dev/og-image.png" />

		<meta name="theme-color" content="#1a1a1a" />

		<!-- Resource hints -->
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		<!-- Preload critical JS -->
		<link rel="modulepreload" href="/src/main.tsx" />

		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♟️</text></svg>"
		/>
	</head>
	<body>
		<!-- Theme: must run before React mounts to avoid FOUC. -->
		<!-- Storage key MUST match THEME_STORAGE_KEY in src/theme/themeStorage.ts -->
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('motlin-chess-theme');
					var mode = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
					var resolved =
						mode === 'system'
							? window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light'
							: mode;
					document.documentElement.setAttribute('data-theme', resolved);
				} catch (e) {
					document.documentElement.setAttribute('data-theme', 'dark');
				}
			})();
		</script>
		<div id="app"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
